# Scaffold configuration.
#
# Settings that can change while the project is under way. Edit this file
# whenever your situation changes, for example when you switch AI tools.
# A missing file or key falls back to the default shown here.
#
# This file is committed, so it holds the project's shared defaults. A setting
# that depends on one person's tool or machine belongs in scaffold.local.yaml
# instead. Create that file next to this one and list only the keys you want to
# override. It is ignored by git, and its values win over the ones below.
#
# Project properties chosen when the project was created (ticket ID prefix and
# number width) live in .copier-answers.yml, which Copier manages.

# Can your AI tool run a subagent: an agent with its own fresh context window?
#   true  - the orchestrator runs the whole pipeline and delegates each role to
#           a subagent, using parallel subagents where that helps (default).
#   false - the orchestrator does its own step, then stops and hands you a
#           ready-to-paste prompt for the next role. You start each role in a
#           new session.
# If this is set incorrectly, Scaffold should still be able to find its way, but it works best when it's telling the truth. ;)
subagents: true
